{% extends "base.html" %}
{% block title %}パスワード再設定 | 学生生活マップ{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>パスワードをお忘れですか？</h1>
    <p class="desc" style="margin-bottom:16px;">登録済みのメールアドレスを入力してください。パスワード再設定用のリンクを送信します。</p>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {{ field.errors }}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">再設定用リンクを送信</button>
    </form>
    <p class="desc" style="margin-top:16px;"><a href="{% url 'accounts:login' %}">← ログイン画面に戻る</a></p>
  </div>
</div>
{% endblock %}
