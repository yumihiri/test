{% extends "base.html" %}
{% block title %}パスワード再設定 | 学生生活マップ{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>メールを送信しました</h1>
    <p class="desc">入力されたメールアドレス宛にパスワード再設定用のリンクを送信しました（該当するアカウントが存在する場合）。メールが届いたらリンクを開いて新しいパスワードを設定してください。</p>
    <p class="desc" style="margin-top:16px;"><a href="{% url 'accounts:login' %}">← ログイン画面に戻る</a></p>
  </div>
</div>
{% endblock %}
