{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="layout map-layout">
  <div id="map"></div>
  <aside class="sidebar" id="sidebar">
    <input type="search" id="spot-search" class="map-search" placeholder="🔍 マップを検索する">
    <h2>カテゴリで絞り込み</h2>
    <ul class="cat-list" id="cat-list"></ul>
    <div class="legend">
      <div><span class="legend-swatch" style="background:#2F6F4E"></span>承認済み</div>
      <div><span class="legend-swatch pending" style="background:#B3541E"></span>承認待ち（本人・管理者のみ表示）</div>
      <div><span class="legend-swatch rejected" style="background:#999"></span>却下（本人・管理者のみ表示）</div>
    </div>
  </aside>
</div>

{{ categories|json_script:"categories-data" }}
{{ spots|json_script:"spots-data" }}
{% endblock %}

{% block extra_scripts %}
<script src="{% static 'js/map.js' %}"></script>
{% endblock %}
